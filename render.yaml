services:
 # Main Web Application
 - type: web
   name: freedium-web
   runtime: docker
   dockerfilePath: ./Dockerfile.render
   region: oregon
   plan: starter
   ipAllowList:
     - cidr: 104.28.39.0/24
       description: "Allow 104.28.39.0 subnet"
   envVars:
     - key: HOST_ADDRESS
       sync: false
     - key: ADMIN_SECRET_KEY
       generateValue: true
     - key: TIMEOUT
       value: 15
     - key: REQUEST_TIMEOUT
       value: 12
     - key: WORKER_TIMEOUT
       value: 85
     - key: CACHE_LIFE_TIME
       value: 18000
     - key: REDIS_HOST
       fromService:
         type: redis
         name: freedium-redis
         property: host
     - key: REDIS_PORT
       fromService:
         type: redis
         name: freedium-redis
         property: port
     - key: DATABASE_URL
       fromDatabase:
         name: freedium-db
         property: connectionString
     - key: SENTRY_SDK_DSN
       sync: false
     - key: DISABLE_EXTERNAL_DOCS
       value: true
     - key: LOG_LEVEL_NAME
       value: INFO
   healthCheckPath: /

 # Redis Cache
 - type: redis
   name: freedium-redis
   region: oregon
   plan: starter
   maxmemoryPolicy: allkeys-lru


 # PostgreSQL Database
databases:
 - name: freedium-db
   databaseName: freedium
   user: freedium
   region: oregon
   plan: starter
